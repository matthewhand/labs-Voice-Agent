name: Public fork validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository_owner != 'NVIDIA-NeMo' && !github.event.repository.private
      && vars.NEMO_CI_EPHEMERAL_LANE == '' && vars.NON_NVIDIA_RUNNER_PREFIX == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Check the Python lock and run documentation tests
        run: |
          python -m pip install uv==0.13.9
          uv lock --check
          uv run --no-project --with ruff==0.15.20 ruff check .
          uv run --no-project --with pytest==9.1.1 python -m pytest \
            tests/unit/test_docs_consistency.py tests/unit/test_docs_review_receipt.py \
            -k "not scoring_signal_count_matches_enum"
      - name: Build the example web client
        working-directory: examples/generic_voice_agent/client
        run: |
          npm ci
          npm run build
