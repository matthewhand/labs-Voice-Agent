<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeMo Voice Agent</title>
  <style>
    .server-selection {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .server-selection label {
      font-weight: bold;
      color: #333;
    }
    
    .server-selection select {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: white;
      font-size: 14px;
      cursor: pointer;
    }
    
    .server-selection select:focus {
      outline: none;
      border-color: #2196F3;
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.2);
    }
    
    .server-selection select:disabled {
      background-color: #f5f5f5;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
  <script>
    // Set the theme before first paint to avoid a light flash. Defaults to dark;
    // an explicit choice made with the in-page toggle is remembered.
    (function () {
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('theme') || 'dark'
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
<div class="container">
  <div class="status-bar">
    <div class="status">
      Transport: <span id="connection-status">Disconnected</span>
    </div>
    <div class="server-selection">
      <label for="server-select">Server:</label>
      <select id="server-select">
        <option value="same-origin">Same-origin (/connect)</option>
        <option value="custom">Custom server</option>
      </select>
    </div>
    <div class="controls">
      <button id="connect-btn">Connect</button>
      <button id="disconnect-btn" disabled>Disconnect</button>
      <button id="mute-btn" disabled>Mute</button>
      <button id="reset-btn" disabled>Reset</button>
    </div>
    <button id="theme-toggle" type="button" title="Toggle light/dark theme">Light</button>
  </div>

  <div id="media-notice" class="notice notice-warning" hidden></div>

  <div class="status-line" id="status-line">Inference: —  ·  Speaker: —</div>

  <section class="diarization">
    <div class="diar-header">
      <h3 class="diar-title">Diarized Transcript</h3>
      <span class="diar-now" id="diar-now">Now speaking: —</span>
    </div>
    <div class="diar-roster" id="diar-roster">
      <span class="diar-empty">No speakers yet</span>
    </div>
    <div class="diar-transcript" id="diar-transcript"></div>
  </section>

  <div class="volume-indicator">
    <div class="volume-label">Microphone Volume:</div>
    <div class="volume-bar-container">
      <div class="volume-bar" id="volume-bar"></div>
    </div>
    <div class="volume-text" id="volume-text">0%</div>
  </div>

  <audio id="bot-audio" autoplay></audio>

  <div class="debug-panel">
    <h3>Debug Info</h3>
    <div id="debug-log"></div>
  </div>
</div>

<script type="module" src="/src/app.ts"></script>
<link rel="stylesheet" href="/src/style.css">
</body>

</html>
